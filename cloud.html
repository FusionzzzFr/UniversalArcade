<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Arcade Cloud</title>
<link rel="stylesheet" href="css/style.css">
<style>
.cloud-page main{display:grid;place-items:center;text-align:center;padding-bottom:112px}
.cloud-card{width:min(720px,calc(100% - 32px));padding:46px 34px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(28,28,30,.68);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 28px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.cloud-icon{width:72px;height:72px;margin:0 auto 22px;display:block;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cloud-card h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.06em;line-height:1;margin-bottom:14px}
.cloud-card p{color:#9a9aa0;font-size:16px;line-height:1.6;margin:0 auto 26px;max-width:520px}
.web-launch{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:#fff;color:#000;text-decoration:none;font-weight:700;transition:.2s ease}
.web-launch:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.28)}
.web-launch svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body class="cloud-page">
<div class="ambient"></div>
<div class="ambient two"></div>
<main>
  <section class="cloud-card">
    <svg class="cloud-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.2h10.1a3.7 3.7 0 0 0 .6-7.35A5.7 5.7 0 0 0 7 10.1a4.05 4.05 0 0 0 .2 8.1Z"/><path d="M12 9.2v6.2M9.8 13.2 12 15.4l2.2-2.2"/></svg>
    <h1>Cloud</h1>
    <p>Your Universal Arcade cloud space is ready for future features.</p>
    <a class="web-launch" href="web.html">Open Web Viewer <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5"/><path d="m19 5-8 8"/><path d="M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></svg></a>
  </section>
</main>
<nav class="navbar" aria-label="Main navigation">

<a class="nav-item" href="games.html" aria-label="Games"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 7.8h8.2a4.5 4.5 0 0 1 4.3 3.4l1.2 4.5a3.4 3.4 0 0 1-6.3 2.2L14 16.2h-4l-1.3 1.7a3.4 3.4 0 0 1-6.2-2.2l1.2-4.5a4.5 4.5 0 0 1 4.2-3.4Z"/><path d="M7.2 12.2v4M5.2 14.2h4"/><path d="M16.6 12.8h.1M18.5 14.7h.1"/></svg><span class="nav-label">Games</span></a>
<a class="nav-item active" href="cloud.html" aria-label="Cloud"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.2h10.1a3.7 3.7 0 0 0 .6-7.35A5.7 5.7 0 0 0 7 10.1a4.05 4.05 0 0 0 .2 8.1Z"/></svg><span class="nav-label">Cloud</span></a>
<a class="nav-item" href="youtube.html" aria-label="YouTube"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="6.1" width="17.6" height="11.8" rx="3.4"/><path class="nav-play" d="m10 9.2 5 2.8-5 2.8Z"/></svg><span class="nav-label">YouTube</span></a>
<a class="nav-item" href="settings.html" aria-label="Settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.2a4.6 4.6 0 0 0-5.8 5.8L4.2 15.7a2.6 2.6 0 1 0 3.7 3.7l4.7-4.7a4.6 4.6 0 0 0 5.8-5.8l-2.7-3.3Z"/></svg><span class="nav-label">Settings</span></a>
</nav>
<script src="js/app.js"></script>
</body>
</html>
