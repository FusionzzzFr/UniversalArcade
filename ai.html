<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Arcade AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ai.css">
</head>
<body class="ai-page">
<div class="ambient"></div>
<div class="ambient two"></div>

<div class="ai-shell">
  <aside class="ai-sidebar">
    <div class="ai-brand">
      <div class="ai-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="6" width="14" height="12" rx="3"/>
          <circle cx="9" cy="11.8" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="11.8" r="1" fill="currentColor" stroke="none"/>
          <path d="M9.5 15h5M9 5V3.5M15 5V3.5M5 10H3.5M20.5 10H19"/>
        </svg>
      </div>
      <span>Universal AI</span>
    </div>

    <button class="new-chat" id="newChat" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
    </button>

    <div class="recent-title">Recent</div>
    <div class="recent-chats" id="recentChats">
      <button class="recent-chat active" type="button">Welcome to Universal AI</button>
    </div>

    <div class="sidebar-bottom">
      <div class="ai-status"><span class="status-dot"></span><span>Ready</span></div>
      <a href="settings.html" class="sidebar-link">Settings</a>
    </div>
  </aside>

  <main class="ai-main">
    <header class="ai-topbar">
      <div>
        <div class="ai-kicker">UNIVERSAL ARCADE</div>
        <h1>Universal AI</h1>
      </div>
      <button class="model-pill" type="button" aria-label="Selected AI model">
        <span class="model-dot"></span>
        <span>Universal AI</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
    </header>

    <section class="chat-wrap" aria-label="AI chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="6" width="14" height="12" rx="3"/>
            <circle cx="9" cy="11.8" r="1" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="11.8" r="1" fill="currentColor" stroke="none"/>
            <path d="M9.5 15h5M9 5V3.5M15 5V3.5"/>
          </svg>
        </div>
        <h2>How can I help?</h2>
        <p>Ask a question, get an idea, or just start a conversation.</p>

        <div class="suggestions">
          <button type="button" class="suggestion">Give me a game idea</button>
          <button type="button" class="suggestion">Help me build a website</button>
          <button type="button" class="suggestion">Explain something simply</button>
          <button type="button" class="suggestion">Write some code</button>
        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>
    </section>

    <div class="composer-area">
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Message Universal AI..." aria-label="Message Universal AI"></textarea>
        <button class="send-button" id="sendButton" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 3.8 4.8 20 12l-16.2 7.2L5 12Zm0 0h9"/></svg>
        </button>
      </form>
      <div class="composer-note">Universal AI can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<nav class="navbar" aria-label="Main navigation">
<a class="nav-item" href="index.html" aria-label="Home"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 10.8 8.5-7 8.5 7"/><path d="M5.8 9.7V20h12.4V9.7"/><path d="M9.3 20v-5.4h5.4V20"/></svg><span class="nav-label">Home</span></a>
<a class="nav-item" href="games.html" aria-label="Games"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8c2.3 0 4.2 1.5 4.8 3.7l1 3.8c.5 2-.7 4.1-2.8 4.6-1.7.4-3.4-.3-4.4-1.8L13.3 17h-2.6l-1.3 1.3c-1 1.5-2.7 2.2-4.4 1.8-2.1-.5-3.3-2.6-2.8-4.6l1-3.8C3.8 9.5 5.7 8 8 8Z"/><path d="M7.1 12.7h4.2M9.2 10.6v4.2"/><path d="M16.6 12.1h.01M18.4 14h.01"/></svg><span class="nav-label">Games</span></a>
<a class="nav-item active" href="ai.html" aria-label="AI"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.7V4M15 5.7V4"/><rect x="4.8" y="5.7" width="14.4" height="13" rx="4"/><path d="M4.8 10H3.2M20.8 10h-1.6M8 18.7v1.8M16 18.7v1.8"/><circle cx="9" cy="11.8" r="1.25" fill="currentColor" stroke="none"/><circle cx="15" cy="11.8" r="1.25" fill="currentColor" stroke="none"/><path d="M9 15h6"/></svg><span class="nav-label">AI</span></a>
<a class="nav-item" href="youtube.html" aria-label="YouTube"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.1" y="5.8" width="17.8" height="12.4" rx="3.8"/><path d="m9.8 9.1 5.2 2.9-5.2 2.9V9.1Z" fill="currentColor" stroke="none"/></svg><span class="nav-label">YouTube</span></a>
<a class="nav-item" href="settings.html" aria-label="Settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="11" cy="17" r="2.2" fill="currentColor" stroke="none"/></svg><span class="nav-label">Settings</span></a>
</nav>
<script src="js/ai.js"></script>
</body>
</html>
