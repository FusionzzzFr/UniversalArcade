<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Arcade AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ai.css">
</head>
<body class="ai-page">
<div class="ambient"></div>
<div class="ambient two"></div>

<aside class="ai-sidebar" aria-label="AI sidebar">
  <div class="sidebar-top">
    <a class="ai-logo" href="index.html" aria-label="Universal Arcade home">
      <span class="ai-logo-mark">UA</span>
      <span>Universal AI</span>
    </a>
    <button class="sidebar-new" id="newChat" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
      <kbd>⌘ N</kbd>
    </button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-title">Chats</div>
    <div class="recent-chats" id="recentChats">
      <button class="chat-link active" type="button"><span class="chat-dot"></span><span class="chat-name">New conversation</span></button>
    </div>
  </div>

  <div class="sidebar-bottom">
    <button class="side-link" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
      <span>Search</span>
    </button>
    <button class="side-link" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h11a2 2 0 0 1 2 2v13l-7.5-3.5-7.5 3.5v-13a2 2 0 0 1 2-2Z"/></svg>
      <span>Saved</span>
    </button>
    <div class="sidebar-user">
      <div class="user-avatar">U</div>
      <div><strong>Universal Arcade</strong><span>Personal</span></div>
      <span class="user-more">•••</span>
    </div>
  </div>
</aside>

<header class="ai-topbar">
  <button class="mobile-menu" type="button" aria-label="Open menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="model-switcher" type="button">
    <span>Universal</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
  </button>
  <div class="top-actions">
    <button class="top-action" type="button" aria-label="Share">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
    </button>
    <button class="top-action" type="button" aria-label="More options"><span>•••</span></button>
  </div>
</header>

<main class="ai-main">
  <section class="chat-area" aria-label="AI chat">
    <div class="welcome" id="welcome">
      <div class="grok-style-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <h1>What can I help with?</h1>
      <p>Ask anything, create something, or explore an idea.</p>
      <div class="suggestions">
        <button type="button" class="suggestion"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 12h6M8 15h4"/></svg><span>Write something</span></button>
        <button type="button" class="suggestion"><svg viewBox="0 0 24 24"><path d="M4.5 6.5h15v11h-15z"/><path d="M8 14l2.5-3 2 2 1.5-2 2 3"/></svg><span>Analyze an image</span></button>
        <button type="button" class="suggestion"><svg viewBox="0 0 24 24"><path d="M5 6h14v12H5z"/><path d="m9 9 6 3-6 3V9Z"/></svg><span>Plan a project</span></button>
        <button type="button" class="suggestion"><svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/></svg><span>Get creative</span></button>
      </div>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
  </section>
</main>

<div class="composer-wrap">
  <div class="composer-hints">
    <button type="button">Fast</button>
    <button type="button">Reason</button>
    <button type="button">Search</button>
  </div>
  <form class="composer" id="composer">
    <button class="composer-tool" type="button" aria-label="Add attachment">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <textarea id="prompt" rows="1" placeholder="What are you curious about?" aria-label="Message Universal AI"></textarea>
    <button class="composer-tool" type="button" aria-label="Voice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"/></svg>
    </button>
    <button class="send-button" id="sendButton" type="submit" aria-label="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 15-7-3.2 14-4.4-5.1L4 12Zm0 0 7.4-2.2"/></svg>
    </button>
  </form>
  <div class="composer-note">Universal AI can make mistakes. Check important information.</div>
</div>

<nav class="navbar" aria-label="Main navigation">
<a class="nav-item" href="index.html" aria-label="Home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.7l8.5 7.1"/><path d="M5.7 9.5V20h12.6V9.5"/><path d="M9.5 20v-5.6h5V20"/></svg><span class="nav-label">Home</span></a>
<a class="nav-item" href="games.html" aria-label="Games"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 7.8h8.2a4.5 4.5 0 0 1 4.3 3.4l1.2 4.5a3.4 3.4 0 0 1-6.3 2.2L14 16.2h-4l-1.3 1.7a3.4 3.4 0 0 1-6.2-2.2l1.2-4.5a4.5 4.5 0 0 1 4.2-3.4Z"/><path d="M7.2 12.2v4M5.2 14.2h4"/><path d="M16.6 12.8h.1M18.5 14.7h.1"/></svg><span class="nav-label">Games</span></a>
<a class="nav-item active" href="ai.html" aria-label="AI"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="6" width="15" height="12" rx="3.8"/><path d="M9 6V4M15 6V4M4.5 10H3M21 10h-1.5M8 18v2M16 18v2"/><circle cx="9" cy="11.5" r="1" class="nav-dot"/><circle cx="15" cy="11.5" r="1" class="nav-dot"/><path d="M9 15h6"/></svg><span class="nav-label">AI</span></a>
<a class="nav-item" href="youtube.html" aria-label="YouTube"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="6.1" width="17.6" height="11.8" rx="3.4"/><path class="nav-play" d="m10 9.2 5 2.8-5 2.8Z"/></svg><span class="nav-label">YouTube</span></a>
<a class="nav-item" href="settings.html" aria-label="Settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.2a4.6 4.6 0 0 0-5.8 5.8L4.2 15.7a2.6 2.6 0 1 0 3.7 3.7l4.7-4.7a4.6 4.6 0 0 0 5.8-5.8l-2.7 2.2-2.6-2.6 2.2-3.3Z"/></svg><span class="nav-label">Settings</span></a>
</nav>
<script src="js/ai.js"></script>
</body>
</html>
