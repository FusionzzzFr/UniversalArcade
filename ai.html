<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Arcade AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ai.css">
</head>
<body class="ai-page">
<div class="ambient"></div>
<div class="ambient two"></div>

<div class="ai-shell">
  <aside class="ai-sidebar">
    <div class="ai-brand">
      <div class="ai-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="6" width="14" height="12" rx="3"/>
          <circle cx="9" cy="11.8" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="11.8" r="1" fill="currentColor" stroke="none"/>
          <path d="M9.5 15h5M9 5V3.5M15 5V3.5M5 10H3.5M20.5 10H19"/>
        </svg>
      </div>
      <span>Universal AI</span>
    </div>

    <button class="new-chat" id="newChat" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
    </button>

    <div class="recent-title">Recent</div>
    <div class="recent-chats" id="recentChats">
      <button class="recent-chat active" type="button">Welcome to Universal AI</button>
    </div>

    <div class="sidebar-bottom">
      <div class="ai-status"><span class="status-dot"></span><span>Ready</span></div>
      <a href="settings.html" class="sidebar-link">Settings</a>
    </div>
  </aside>

  <main class="ai-main">
    <header class="ai-topbar">
      <div>
        <div class="ai-kicker">UNIVERSAL ARCADE</div>
        <h1>Universal AI</h1>
      </div>
      <button class="model-pill" type="button" aria-label="Selected AI model">
        <span class="model-dot"></span>
        <span>Universal AI</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
    </header>

    <section class="chat-wrap" aria-label="AI chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="6" width="14" height="12" rx="3"/>
            <circle cx="9" cy="11.8" r="1" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="11.8" r="1" fill="currentColor" stroke="none"/>
            <path d="M9.5 15h5M9 5V3.5M15 5V3.5"/>
          </svg>
        </div>
        <h2>How can I help?</h2>
        <p>Ask a question, get an idea, or just start a conversation.</p>

        <div class="suggestions">
          <button type="button" class="suggestion">Give me a game idea</button>
          <button type="button" class="suggestion">Help me build a website</button>
          <button type="button" class="suggestion">Explain something simply</button>
          <button type="button" class="suggestion">Write some code</button>
        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>
    </section>

    <div class="composer-area">
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Message Universal AI..." aria-label="Message Universal AI"></textarea>
        <button class="send-button" id="sendButton" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 3.8 4.8 20 12l-16.2 7.2L5 12Zm0 0h9"/></svg>
        </button>
      </form>
      <div class="composer-note">Universal AI can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<nav class="navbar" aria-label="Main navigation">
<a class="nav-item" href="index.html" aria-label="Home"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.8 12 4.2l7.5 6.6"/><path d="M6 10.5V20h12v-9.5"/></svg><span class="nav-label">Home</span></a>
<a class="nav-item" href="games.html" aria-label="Games"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 8.3h9.6c2.1 0 3.8 1.4 4.3 3.4l1 3.8c.5 2-.7 4-2.8 4.5-1.6.4-3.2-.3-4.2-1.7l-1.5-2.1h-3.2l-1.5 2.1c-1 1.4-2.6 2.1-4.2 1.7-2.1-.5-3.3-2.5-2.8-4.5l1-3.8c.5-2 2.2-3.4 4.3-3.4Z"/><path d="M8 11.5v4M6 13.5h4"/><circle cx="16.5" cy="12.5" r="1" fill="currentColor" stroke="none"/><circle cx="18.5" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg><span class="nav-label">Games</span></a>
<a class="nav-item active" href="ai.html" aria-label="AI"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5V3.8M15 5.5V3.8"/><path d="M12 3.8v1.7"/><rect x="5" y="6" width="14" height="12" rx="3"/><circle cx="9" cy="11.8" r="1.15" fill="currentColor" stroke="none"/><circle cx="15" cy="11.8" r="1.15" fill="currentColor" stroke="none"/><path d="M9.5 15h5"/><path d="M5 10H3.5M20.5 10H19M8 18v2M16 18v2"/></svg><span class="nav-label">AI</span></a>
<a class="nav-item" href="youtube.html" aria-label="YouTube"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="3.5"/><path d="m10 9.2 5 2.8-5 2.8V9.2Z"/></svg><span class="nav-label">YouTube</span></a>
<a class="nav-item" href="settings.html" aria-label="Settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.9v2.3M12 18.8v2.3M21.1 12h-2.3M5.2 12H2.9M18.45 5.55l-1.63 1.63M7.18 16.82l-1.63 1.63M18.45 18.45l-1.63-1.63M7.18 7.18 5.55 5.55"/></svg><span class="nav-label">Settings</span></a>
</nav>
<script src="js/ai.js"></script>
</body>
</html>
