<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Arcade Web</title>
<link rel="stylesheet" href="css/style.css">
<style>
.web-page main{display:flex;flex-direction:column;min-height:100vh;padding:28px 24px 118px;gap:16px}
.web-top{width:min(1180px,100%);margin:0 auto;display:flex;gap:10px;align-items:center}
.web-top input{flex:1;min-width:0;height:52px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(28,28,30,.72);color:#fff;padding:0 18px;font:inherit;outline:none;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.web-top input:focus{border-color:rgba(255,255,255,.28)}
.web-top button{height:52px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:#fff;color:#000;padding:0 20px;font-weight:700;cursor:pointer}
.web-shell{width:min(1180px,100%);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:rgba(12,12,14,.72);box-shadow:0 28px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.web-bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.09);color:#85858c;font-size:13px}
.web-dot{width:8px;height:8px;border-radius:50%;background:#555}
.web-status{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
#browser{width:100%;height:calc(100vh - 222px);min-height:420px;border:0;background:#fff}
.web-note{width:min(1180px,100%);margin:0 auto;color:#85858c;font-size:12px;text-align:center}
@media(max-width:700px){.web-page main{padding:14px 12px 104px}.web-top button{padding:0 15px}.web-top input{height:48px}.web-top button{height:48px}.web-shell{border-radius:20px}#browser{height:calc(100vh - 196px);min-height:380px}}
</style>
</head>
<body class="web-page">
<div class="ambient"></div>
<div class="ambient two"></div>
<main>
  <form class="web-top" id="webForm">
    <input id="urlInput" type="text" inputmode="url" autocomplete="off" placeholder="Enter a website…" aria-label="Website URL">
    <button type="submit">Go</button>
  </form>
  <section class="web-shell">
    <div class="web-bar">
      <span class="web-dot"></span><span id="hostLabel">Ready</span>
      <span class="web-status" id="statusLabel">Proxy not configured</span>
    </div>
    <iframe id="browser" title="Web viewer" referrerpolicy="no-referrer" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts"></iframe>
  </section>
  <div class="web-note">Set <b>PROXY_BASE</b> in this file to your deployed Worker URL.</div>
</main>
<nav class="navbar" aria-label="Main navigation">
<a class="nav-item" href="index.html" aria-label="Home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.7l8.5 7.1"/><path d="M5.7 9.5V20h12.6V9.5"/><path d="M9.5 20v-5.6h5V20"/></svg><span class="nav-label">Home</span></a>
<a class="nav-item" href="games.html" aria-label="Games"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 7.8h8.2a4.5 4.5 0 0 1 4.3 3.4l1.2 4.5a3.4 3.4 0 0 1-6.3 2.2L14 16.2h-4l-1.3 1.7a3.4 3.4 0 0 1-6.2-2.2l1.2-4.5a4.5 4.5 0 0 1 4.2-3.4Z"/><path d="M7.2 12.2v4M5.2 14.2h4"/><path d="M16.6 12.8h.1M18.5 14.7h.1"/></svg><span class="nav-label">Games</span></a>
<a class="nav-item" href="cloud.html" aria-label="Cloud"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.2h10.1a3.7 3.7 0 0 0 .6-7.35A5.7 5.7 0 0 0 7 10.1a4.05 4.05 0 0 0 .2 8.1Z"/></svg><span class="nav-label">Cloud</span></a>
<a class="nav-item" href="youtube.html" aria-label="YouTube"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="6.1" width="17.6" height="11.8" rx="3.4"/><path class="nav-play" d="m10 9.2 5 2.8-5 2.8Z"/></svg><span class="nav-label">YouTube</span></a>
<a class="nav-item" href="settings.html" aria-label="Settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.2a4.6 4.6 0 0 0-5.8 5.8L4.2 15.7a2.6 2.6 0 1 0 3.7 3.7l4.7-4.7a4.6 4.6 0 0 0 5.8-5.8l-2.7 2.2-2.6-3.3Z"/></svg><span class="nav-label">Settings</span></a>
</nav>
<script>
const PROXY_BASE='';
const form=document.getElementById('webForm');
const input=document.getElementById('urlInput');
const frame=document.getElementById('browser');
const hostLabel=document.getElementById('hostLabel');
const statusLabel=document.getElementById('statusLabel');
function normalize(value){
  let v=value.trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v='https://'+v;
  return v;
}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const raw=normalize(input.value);
  if(!raw) return;
  let u;
  try{u=new URL(raw)}catch{statusLabel.textContent='Invalid URL';return;}
  if(!/^https?:$/.test(u.protocol)){statusLabel.textContent='Only HTTP(S) is supported';return;}
  if(!PROXY_BASE){statusLabel.textContent='Set PROXY_BASE first';return;}
  const proxy=new URL(PROXY_BASE);
  proxy.searchParams.set('url',u.href);
  hostLabel.textContent=u.hostname;
  statusLabel.textContent='Loading '+u.hostname;
  frame.src=proxy.href;
});
frame.addEventListener('load',()=>{statusLabel.textContent='Loaded';});
</script>
</body>
</html>
