<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Arcade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0c;--bg2:#151516;--panel:rgba(28,28,30,.72);--border:rgba(255,255,255,.11);
  --text:#f5f5f5;--muted:#99999f;--hover:#fff;--active:rgba(255,255,255,.11)
}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.07),transparent 30%),radial-gradient(circle at 85% 85%,rgba(255,255,255,.045),transparent 32%),linear-gradient(135deg,#09090a 0%,#151516 48%,#0b0b0c 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 90%)}
.ambient{position:fixed;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.035);filter:blur(80px);pointer-events:none;top:-180px;left:-100px}.ambient.two{top:auto;left:auto;right:-170px;bottom:-190px;background:rgba(255,255,255,.025)}
main{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;padding:40px}
.hero{text-align:center;max-width:850px}.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--border);background:rgba(255,255,255,.045);border-radius:999px;color:#bdbdc2;font-size:12px;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(16px)}
.dot{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.7)}
h1{font-size:clamp(48px,9vw,100px);line-height:.95;letter-spacing:-.065em;margin:25px 0 18px;font-weight:800;background:linear-gradient(180deg,#fff,#aaa);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);font-size:16px;line-height:1.7;max-width:600px;margin:auto}.preview{margin:42px auto 0;width:min(760px,90vw);height:110px;border:1px solid var(--border);border-radius:24px;background:rgba(255,255,255,.035);backdrop-filter:blur(22px);box-shadow:0 25px 80px rgba(0,0,0,.35);display:flex;align-items:center;padding:18px;gap:12px}.block{height:74px;flex:1;border-radius:15px;background:linear-gradient(145deg,#29292b,#181819);border:1px solid rgba(255,255,255,.07)}.block:nth-child(2){background:linear-gradient(145deg,#363638,#202022)}.block:nth-child(3){background:linear-gradient(145deg,#222224,#111113)}
.nav{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px;border:1px solid var(--border);border-radius:22px;background:rgba(22,22,24,.74);backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);box-shadow:0 18px 55px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.05)}
.nav a{position:relative;display:flex;align-items:center;gap:9px;height:46px;padding:0 16px;color:#a9a9ae;text-decoration:none;border-radius:15px;font-size:14px;font-weight:600;transition:.22s ease;white-space:nowrap}.nav a:hover{color:#fff;background:rgba(255,255,255,.07);transform:translateY(-1px)}.nav a.active{color:#fff;background:var(--active);box-shadow:inset 0 1px rgba(255,255,255,.05)}
.icon{width:18px;height:18px;display:grid;place-items:center;font-size:17px}.nav a::after{content:"";position:absolute;left:50%;bottom:-7px;width:0;height:2px;border-radius:99px;background:#fff;transform:translateX(-50%);transition:.2s}.nav a:hover::after,.nav a.active::after{width:12px}
@media(max-width:760px){main{padding:20px}.nav{bottom:14px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{height:44px;padding:0 13px}.nav a span.label{display:none}.nav a{gap:0;min-width:48px;justify-content:center}.icon{font-size:19px}.preview{height:85px;padding:12px}.block{height:58px}.block:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="ambient"></div><div class="ambient two"></div>
<main><section class="hero"><div class="badge"><span class="dot"></span> Universal Arcade</div><h1>Play without limits.</h1><p>A clean, fast arcade built around a dark gray, black and white aesthetic. This is the starting foundation for the games site.</p><div class="preview"><div class="block"></div><div class="block"></div><div class="block"></div></div></section></main>
<nav class="nav" aria-label="Main navigation">
  <a href="#home" class="active"><span class="icon">⌂</span><span class="label">Home</span></a>
  <a href="#games"><span class="icon">◈</span><span class="label">Games</span></a>
  <a href="#ai"><span class="icon">✦</span><span class="label">AI</span></a>
  <a href="#youtube"><span class="icon">▶</span><span class="label">YouTube</span></a>
  <a href="#settings"><span class="icon">⚙</span><span class="label">Settings</span></a>
</nav>
<script>
const links=[...document.querySelectorAll('.nav a')];
links.forEach(link=>link.addEventListener('click',()=>{links.forEach(x=>x.classList.remove('active'));link.classList.add('active')}));
</script>
</body>
</html>
