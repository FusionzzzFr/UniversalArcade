<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Arcade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ambient"></div>
<div class="ambient two"></div>
<main class="home">
  <section class="hero">
    <div class="saturn-mark" aria-label="Universal Arcade logo">
      <svg viewBox="0 0 220 150" role="img" aria-hidden="true">
        <ellipse class="saturn-ring-outline" cx="110" cy="75" rx="86" ry="27" transform="rotate(-12 110 75)"/>
        <ellipse class="saturn-ring" cx="110" cy="75" rx="86" ry="27" transform="rotate(-12 110 75)"/>
        <circle class="saturn-planet" cx="110" cy="73" r="34"/>
      </svg>
    </div>
    <h1>Universal Arcade</h1>
    <form class="game-search" id="gameSearch">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
      <input id="gameSearchInput" type="search" placeholder="Search games..." autocomplete="off" aria-label="Search games">
    </form>
  </section>
</main>
