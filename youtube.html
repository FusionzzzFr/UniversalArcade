<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Universaltube • Universal Arcade</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--line:rgba(255,255,255,.10);--panel:rgba(255,255,255,.055);--muted:rgba(255,255,255,.48)}
*{box-sizing:border-box}.ut-page{height:100vh;min-height:100vh;overflow:auto;padding:20px 22px 110px;scrollbar-width:none}.ut-page::-webkit-scrollbar{display:none}.ut-shell{width:100%;max-width:1800px;margin:0 auto}.ut-top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:minmax(210px,270px) minmax(360px,1fr) auto;gap:22px;align-items:center;padding:8px 0 22px;background:linear-gradient(#050505 78%,rgba(5,5,5,0))}.ut-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:28px;font-weight:850;letter-spacing:-.055em}.ut-mark{width:48px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center}.ut-mark svg{width:23px;height:23px;fill:#050505}.ut-search{height:62px;display:flex;width:100%;max-width:1000px;margin:auto}.ut-search input{min-width:0;flex:1;border:1px solid var(--line);border-right:0;border-radius:18px 0 0 18px;background:var(--panel);color:#fff;outline:0;padding:0 22px;font:600 15px inherit;backdrop-filter:blur(18px)}.ut-search input::placeholder{color:rgba(255,255,255,.34)}.ut-search button{width:76px;border:1px solid var(--line);border-radius:0 18px 18px 0;background:rgba(255,255,255,.075);color:#fff;cursor:pointer}.ut-search svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.ut-actions{display:flex;gap:10px}.ut-pill{height:46px;padding:0 17px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:#fff;font:700 13px inherit;cursor:pointer}.ut-pill:hover{background:rgba(255,255,255,.10)}.ut-body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}.ut-side{position:sticky;top:108px;height:max-content;display:grid;gap:6px}.ut-side button{height:48px;width:100%;border:0;border-radius:14px;background:transparent;color:rgba(255,255,255,.62);padding:0 16px;text-align:left;font:700 14px inherit;cursor:pointer}.ut-side button:hover,.ut-side button.active{background:rgba(255,255,255,.08);color:#fff}.ut-side .sep{height:1px;background:var(--line);margin:10px 0}.ut-side small{padding:0 16px;color:rgba(255,255,255,.25);font-size:10px;text-transform:uppercase;letter-spacing:.18em}.ut-heading{display:flex;justify-content:space-between;align-items:flex-end;margin:5px 0 20px}.ut-heading h1{margin:0;font-size:42px;line-height:1;letter-spacing:-.06em}.ut-heading p{margin:8px 0 0;color:var(--muted);font-size:14px}.ut-status{color:rgba(255,255,255,.36);font-size:12px}.ut-chips{display:flex;gap:9px;overflow:auto;margin:0 0 24px;padding-bottom:3px;scrollbar-width:none}.ut-chips::-webkit-scrollbar{display:none}.ut-chip{flex:0 0 auto;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:rgba(255,255,255,.72);font:700 13px inherit;cursor:pointer}.ut-chip.active,.ut-chip:hover{background:#fff;color:#050505}.ut-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 20px}.ut-card{min-width:0;cursor:pointer;transition:transform .18s ease}.ut-card:hover{transform:translateY(-4px)}.ut-thumb{position:relative;aspect-ratio:16/9;border-radius:17px;overflow:hidden;background:#111;border:1px solid var(--line);box-shadow:0 22px 48px rgba(0,0,0,.22)}.ut-thumb img{display:block;width:100%;height:100%;object-fit:cover}.ut-thumb .ut-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.24);opacity:0;transition:.18s}.ut-thumb .ut-play span{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center}.ut-thumb .ut-play svg{width:22px;height:22px;fill:#050505;margin-left:3px}.ut-card:hover .ut-play{opacity:1}.ut-time{position:absolute;right:9px;bottom:9px;padding:5px 7px;border-radius:6px;background:rgba(0,0,0,.82);color:#fff;font-size:11px;font-weight:850}.ut-info{display:grid;grid-template-columns:40px minmax(0,1fr);gap:11px;padding:11px 2px}.ut-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid var(--line);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:850}.ut-title{margin:0;color:#fff;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ut-meta{margin-top:6px;color:rgba(255,255,255,.4);font-size:11px;line-height:1.45}.ut-loading{min-height:180px;display:grid;place-items:center;color:var(--muted);font-size:14px}.ut-more{display:flex;justify-content:center;padding:24px}.ut-more button{height:46px;padding:0 20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:#fff;font:700 13px inherit;cursor:pointer}.ut-empty{padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--muted);display:none}.ut-empty.show{display:block}.ut-empty strong{display:block;color:#fff;font-size:18px;margin-bottom:8px}.ut-watch{display:none}.ut-watch.show{display:block}.ut-watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px}.ut-player{width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}.ut-player iframe{width:100%;height:100%;border:0}.ut-watch h1{font-size:28px;line-height:1.25;letter-spacing:-.04em;margin:16px 0 8px}.ut-watch-meta{color:var(--muted);font-size:13px}.ut-desc{margin-top:15px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:rgba(255,255,255,.68);font-size:13px;line-height:1.6;white-space:pre-wrap}.ut-related h2{margin:2px 0 14px;font-size:17px}.ut-related .ut-grid{grid-template-columns:1fr;gap:14px}.ut-related .ut-info{padding-top:8px}.ut-back{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:#fff;font:700 13px inherit;cursor:pointer;margin-bottom:15px}.ut-mobile-title{display:none}
@media(max-width:1300px){.ut-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.ut-body{grid-template-columns:205px minmax(0,1fr)}.ut-watch-layout{grid-template-columns:1fr}.ut-related .ut-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.ut-top{grid-template-columns:1fr}.ut-brand{display:none}.ut-actions{display:none}.ut-search{max-width:none}.ut-body{display:block}.ut-side{position:static;display:flex;overflow:auto;margin-bottom:16px}.ut-side button{flex:0 0 auto;width:auto}.ut-side .sep,.ut-side small{display:none}.ut-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.ut-heading h1{font-size:34px}}
@media(max-width:620px){.ut-page{padding:10px 12px 105px}.ut-search{height:52px}.ut-search button{width:62px}.ut-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 11px}.ut-thumb{border-radius:13px}.ut-info{grid-template-columns:34px minmax(0,1fr);gap:8px}.ut-avatar{width:34px;height:34px}.ut-title{font-size:13px}.ut-heading h1{font-size:30px}.ut-chips{margin-bottom:18px}.ut-watch h1{font-size:22px}}
@media(max-width:420px){.ut-grid{grid-template-columns:1fr}.ut-heading p{display:none}}
</style>
</head>
<body>
<main class="ut-page">
<div class="ut-shell">
<header class="ut-top">
<a class="ut-brand" href="youtube.html" aria-label="Universaltube home"><span class="ut-mark"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.9 2.9 0 0 0-2.05-2.05C17.74 4.6 12 4.6 12 4.6s-5.74 0-7.55.55A2.9 2.9 0 0 0 2.4 7.2C1.85 9 1.85 12 1.85 12s0 3 .55 4.8a2.9 2.9 0 0 0 2.05 2.05c1.81.55 7.55.55 7.55.55s5.74 0 7.55-.55a2.9 2.9 0 0 0 2.05-2.05c.55-1.8.55-4.8.55-4.8s0-3-.55-4.8ZM10 15.5v-7l5 3.5-5 3.5Z"/></svg></span>Universaltube</a>
<form class="ut-search" id="searchForm"><input id="searchInput" autocomplete="off" placeholder="Search YouTube videos"><button type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/></svg></button></form>
<div class="ut-actions"><button class="ut-pill" id="homeButton">Home</button><button class="ut-pill" id="trendingButton">Trending</button></div>
</header>
<div class="ut-body">
<aside class="ut-side">
<button class="active" data-home>Home</button><button data-query="gaming">Gaming</button><button data-query="music">Music</button><button data-query="news">News</button><button data-query="sports">Sports</button><button data-query="minecraft">Minecraft</button><button data-query="fortnite">Fortnite</button><button data-query="funny videos">Funny</button>
<div class="sep"></div><small>Universaltube</small>
</aside>
<section>
<div id="browseView">
<div class="ut-heading"><div><h1 id="browseTitle">Universaltube</h1><p id="browseSubtitle">A full-page YouTube browser for Universal Arcade</p></div><span class="ut-status" id="status"></span></div>
<div class="ut-chips" id="chips"><button class="ut-chip active" data-query="gaming">Gaming</button><button class="ut-chip" data-query="music">Music</button><button class="ut-chip" data-query="minecraft">Minecraft</button><button class="ut-chip" data-query="fortnite">Fortnite</button><button class="ut-chip" data-query="funny videos">Funny</button><button class="ut-chip" data-query="trailers">Trailers</button><button class="ut-chip" data-query="technology">Tech</button></div>
<div class="ut-grid" id="videoGrid"></div>
<div class="ut-empty" id="emptyState"><strong>No videos found</strong><span>Try another search or category.</span></div>
<div class="ut-loading" id="loading">Loading videos…</div>
<div class="ut-more"><button id="moreButton" hidden>Load more videos</button></div>
</div>
<div class="ut-watch" id="watchView">
<button class="ut-back" id="backButton">← Back to videos</button>
<div class="ut-watch-layout"><div><div class="ut-player" id="utPlayer"></div><h1 id="watchTitle"></h1><div class="ut-watch-meta" id="watchMeta"></div><div class="ut-desc" id="watchDescription"></div></div><aside class="ut-related"><h2>More videos</h2><div class="ut-grid" id="relatedGrid"></div></aside></div>
</div>
</section></div></div></main>
<nav class="navbar" aria-label="Main navigation">
<a class="nav-item" href="index.html" aria-label="Home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5Z"/></svg><span class="nav-label">Home</span></a>
<a class="nav-item" href="games.html" aria-label="Games"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="4"/><path d="M8 12h4M10 10v4M16 11h.01M18 13h.01"/></svg><span class="nav-label">Games</span></a>
<a class="nav-item" href="cloud.html" aria-label="Cloud"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M7.2 18.2h10.1a3.7 3.7 0 0 0 .6-7.35A5.7 5.7 0 0 0 7 10.1a4.05 4.05 0 0 0 .2 8.1Z"/></svg><span class="nav-label">Cloud</span></a>
<a class="nav-item active" href="youtube.html" aria-label="Universaltube"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21.6 7.2a2.9 2.9 0 0 0-2.05-2.05C17.74 4.6 12 4.6 12 4.6s-5.74 0-7.55.55A2.9 2.9 0 0 0 2.4 7.2C1.85 9 1.85 12 1.85 12s0 3 .55 4.8a2.9 2.9 0 0 0 2.05 2.05c1.81.55 7.55.55 7.55.55s5.74 0 7.55-.55a2.9 2.9 0 0 0 2.05-2.05c.55-1.8.55-4.8.55-4.8Z"/><path d="m10 15.5 5-3.5-5-3.5v7Z"/></svg><span class="nav-label">Universaltube</span></a>
<a class="nav-item" href="settings.html" aria-label="Settings"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.2a1.8 1.8 0 0 1-2.5 2.5l-.2-.1a1.7 1.7 0 0 0-2.6 1.2v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.7 1.7 0 0 0-2.6-1.2l-.2.1a1.8 1.8 0 0 1-2.5-2.5l.1-.2A1.7 1.7 0 0 0 6.2 12a1.7 1.7 0 0 0-1.8-2.6h-.2a1.8 1.8 0 0 1 0-3.6h.2A1.7 1.7 0 0 0 6.2 3.2l-.1-.2a1.8 1.8 0 0 1 2.5-2.5l.2.1A1.7 1.7 0 0 0 11.4-.6h.2a1.8 1.8 0 0 1 3.6 0v.2a1.7 1.7 0 0 0 2.6 1.2l.2-.1A1.8 1.8 0 0 1 21.6 15Z"/></svg><span class="nav-label">Settings</span></a>
</nav>
<script>
const APIS=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://pipedapi.reallyaweso.me'];
let apiIndex=0,currentQuery='gaming',nextPage=null,currentResults=[],loading=false;
const $=id=>document.getElementById(id),grid=$('videoGrid'),loadingEl=$('loading'),empty=$('emptyState'),status=$('status'),more=$('moreButton'),browseView=$('browseView'),watchView=$('watchView'),player=$('utPlayer');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function idOf(v){const u=String(v.url||'');return v.videoId||((u.match(/[?&]v=([^&]+)/)||[])[1])||''}
function normalize(v){const id=idOf(v),thumb=v.thumbnail||v.thumbnailUrl||`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;return {videoId:id,title:v.title||'',author:v.uploaderName||v.uploader||'Unknown channel',views:v.views||0,duration:v.duration||0,published:v.uploadedDate||'',thumbnail:thumb,description:v.shortDescription||v.description||'',url:v.url||`/watch?v=${id}`}}
function fmt(n){n=Number(n||0);if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toString()}
function dur(s){s=Number(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60).toString().padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${sec}`:`${m}:${sec}`}
function initials(s){return String(s||'U').trim().slice(0,1).toUpperCase()}
function card(v){if(!v.videoId)return '';return `<article class="ut-card" data-id="${esc(v.videoId)}"><div class="ut-thumb"><img loading="lazy" src="${esc(v.thumbnail)}" alt=""><div class="ut-play"><span><svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6V6Z"/></svg></span></div><span class="ut-time">${dur(v.duration)}</span></div><div class="ut-info"><div class="ut-avatar">${esc(initials(v.author))}</div><div><h2 class="ut-title">${esc(v.title)}</h2><div class="ut-meta">${esc(v.author)}<br>${fmt(v.views)} views${v.published?' • '+esc(v.published):''}</div></div></div></article>`}
async function request(path){let last='';for(let i=0;i<APIS.length;i++){const base=APIS[(apiIndex+i)%APIS.length];try{const r=await fetch(base+path,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();apiIndex=(apiIndex+i)%APIS.length;return data}catch(e){last=e.message}}throw Error(last||'Video service unavailable')}
async function firstSearch(q){const data=await request(`/search?q=${encodeURIComponent(q)}&filter=videos`);const items=Array.isArray(data?.items)?data.items:[];return {items:items.map(normalize),next:data?.nextpage||null}}
async function nextSearch(token,q){const data=await request(`/nextpage/search?nextpage=${encodeURIComponent(token)}&q=${encodeURIComponent(q)}&filter=videos`);const items=Array.isArray(data?.items)?data.items:[];return {items:items.map(normalize),next:data?.nextpage||null}}
function setLoading(v){loading=v;loadingEl.style.display=v?'grid':'none';more.disabled=v}
function render(items,append){if(!append)grid.innerHTML='';grid.insertAdjacentHTML('beforeend',items.map(card).join(''));status.textContent=`${grid.querySelectorAll('.ut-card').length} videos`}
async function load(query='gaming',append=false){if(loading)return;currentQuery=query;empty.classList.remove('show');setLoading(true);if(!append){nextPage=null;currentResults=[];grid.innerHTML='';status.textContent='Loading…'}try{let result;if(append&&nextPage)result=await nextSearch(nextPage,currentQuery);else result=await firstSearch(currentQuery);if(!result.items.length&&!append)empty.classList.add('show');currentResults=append?currentResults.concat(result.items):result.items;render(result.items,append);nextPage=result.next;more.hidden=!nextPage}catch(e){if(!append){grid.innerHTML='';empty.innerHTML=`<strong>Couldn’t load videos</strong><span>${esc(e.message)}</span>`;empty.classList.add('show')}more.hidden=true;status.textContent='Offline'}finally{setLoading(false)}}
async function browseQuery(q,title){$('browseTitle').textContent=title;$('browseSubtitle').textContent=`Videos about ${q}`;searchInput.value=q;setActive(q);browseView.style.display='block';watchView.classList.remove('show');player.innerHTML='';await load(q,false)}
function setActive(q){document.querySelectorAll('.ut-side button[data-query]').forEach(b=>b.classList.toggle('active',b.dataset.query===q));document.querySelectorAll('.ut-chip').forEach(b=>b.classList.toggle('active',b.dataset.query===q))}
function home(){browseQuery('gaming','Universaltube')}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=searchInput.value.trim();if(q)browseQuery(q,'Search results')});$('homeButton').onclick=home;$('trendingButton').onclick=()=>browseQuery('trending','Trending');more.onclick=()=>load(currentQuery,true);$('backButton').onclick=()=>{browseView.style.display='block';watchView.classList.remove('show');player.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})};
document.querySelectorAll('.ut-side [data-query],.ut-chip[data-query]').forEach(b=>b.addEventListener('click',()=>browseQuery(b.dataset.query,b.textContent.trim())));
grid.addEventListener('click',e=>{const c=e.target.closest('.ut-card');if(c)watch(c.dataset.id)});$('relatedGrid').addEventListener('click',e=>{const c=e.target.closest('.ut-card');if(c)watch(c.dataset.id)});
function watch(id){const item=currentResults.find(v=>v.videoId===id);if(!item)return;browseView.style.display='none';watchView.classList.add('show');player.innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="${esc(item.title)}"></iframe>`;$('watchTitle').textContent=item.title;$('watchMeta').textContent=`${item.author} • ${fmt(item.views)} views${item.published?' • '+item.published:''}`;$('watchDescription').textContent=item.description||'No description available.';$('relatedGrid').innerHTML=currentResults.filter(v=>v.videoId!==id).slice(0,8).map(card).join('');window.scrollTo({top:0,behavior:'smooth'})}
let searchInput=$('searchInput');
load('gaming',false);
</script>
</body>
</html>
