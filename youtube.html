<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>YouTube • Universal Arcade</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--b:#0f0f0f;--s:#181818;--s2:#272727;--t:#f1f1f1;--m:#aaa;--r:#ff0033}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--b);color:var(--t);font-family:Arial,sans-serif}body{overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.head{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid #1c1c1c}.logo{min-width:205px;display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-size:21px;font-weight:700}.mark{width:34px;height:24px;border-radius:7px;background:var(--r);display:grid;place-items:center}.mark:after{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #fff}.search{display:flex;height:42px;flex:1;max-width:760px}.search input{min-width:0;flex:1;background:#121212;color:#fff;border:1px solid #303030;border-right:0;border-radius:24px 0 0 24px;padding:0 18px;outline:0}.search input:focus{border-color:#3ea6ff}.search button{width:64px;border:1px solid #303030;background:#222;color:#fff;border-radius:0 24px 24px 0;font-size:20px}.actions{margin-left:auto;display:flex;align-items:center;gap:8px}.action{width:42px;height:42px;border:0;border-radius:50%;background:none;color:#fff;font-size:19px}.action:hover{background:#272727}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#777,#222);font-size:11px;font-weight:700}.body{display:flex;min-height:0;flex:1}.side{width:240px;flex:0 0 240px;padding:12px 10px;overflow:auto}.nav{width:100%;height:44px;border:0;border-radius:10px;background:none;color:#fff;display:flex;align-items:center;gap:22px;padding:0 16px;text-align:left}.nav:hover,.nav.active{background:var(--s2)}.ico{width:22px;text-align:center;font-size:19px}.sep{height:1px;background:#292929;margin:13px 10px}.st{padding:10px 16px;font-size:13px;font-weight:700}.main{min-width:0;flex:1;overflow:auto;padding:18px 24px 70px}.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:20px;position:sticky;top:-18px;background:linear-gradient(var(--b) 75%,transparent);z-index:3}.chip{border:0;border-radius:9px;background:var(--s2);color:#fff;padding:9px 15px;white-space:nowrap}.chip.active{background:#fff;color:#111;font-weight:700}.status{text-align:center;color:var(--m);padding:50px 20px;display:none}.status.show{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 16px}.card{cursor:pointer}.thumb{position:relative;aspect-ratio:16/9;background:#222;border-radius:10px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}.card:hover .thumb img{transform:scale(1.02)}.dur{position:absolute;right:7px;bottom:7px;background:#000d;padding:3px 5px;border-radius:4px;font-size:12px}.meta{display:grid;grid-template-columns:38px 1fr;gap:10px;margin-top:11px}.ca{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#3b3b3b;display:grid;place-items:center;font-size:11px;font-weight:700}.ca img{width:100%;height:100%;object-fit:cover}.title{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.info{font-size:13px;color:var(--m);line-height:1.45;margin-top:3px}.more{text-align:center;padding:30px}.more button{display:none;background:#222;border:1px solid #444;color:#fff;border-radius:22px;padding:11px 18px;font-weight:700}.more button.show{display:inline-block}.watch{display:none;max-width:1500px;margin:auto;padding:24px}.watch.open{display:block}.back{border:0;background:none;color:#ddd;margin-bottom:15px}.wgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.65fr);gap:20px}.player{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.wtitle{margin-top:16px;font-size:22px;font-weight:700;line-height:1.35}.wrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.channel{display:flex;align-items:center;gap:10px;margin-right:auto}.sub{background:#fff;color:#111;border:0;border-radius:20px;padding:10px 16px;font-weight:700}.wa{background:#272727;color:#fff;border:0;border-radius:20px;padding:10px 15px}.desc{margin-top:16px;background:#272727;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.55;white-space:pre-wrap}.next{display:flex;flex-direction:column;gap:12px}.mini{display:grid;grid-template-columns:160px 1fr;gap:9px;cursor:pointer}.mini img{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.miniTitle{font-size:14px;font-weight:600;line-height:1.35}.miniInfo{font-size:12px;color:#aaa;margin-top:3px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:11px 16px;border-radius:8px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wgrid{grid-template-columns:1fr}.next{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:800px){.side{width:72px;flex-basis:72px}.nav{justify-content:center;padding:0}.nav span:not(.ico),.sep,.st{display:none}.logo{min-width:auto}.logo span{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:14px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.main{padding:10px}.head{gap:8px;padding:0 9px}.action:nth-child(1),.action:nth-child(2){display:none}.next{display:flex}.mini img{width:140px}.wgrid{gap:12px}}
</style>
</head>
<body>
<div class="app">
<header class="head"><a class="logo" href="#" onclick="home();return false"><span class="mark"></span><span>YouTube</span></a><form class="search" id="form"><input id="q" placeholder="Search" autocomplete="off"><button>⌕</button></form><div class="actions"><button class="action" onclick="openYT()">↗</button><button class="action" onclick="toast('Use Universal Arcade settings for theme controls.')">◐</button><button class="action" onclick="toast('Create is available on YouTube.')">＋</button><div class="avatar">UA</div></div></header>
<div class="body"><aside class="side"><button class="nav active" onclick="home()" data-home><span class="ico">⌂</span><span>Home</span></button><button class="nav" onclick="search('gaming')"><span class="ico">▶</span><span>Shorts</span></button><button class="nav" onclick="toast('Subscriptions require a YouTube account.')"><span class="ico">▣</span><span>Subscriptions</span></button><div class="sep"></div><button class="nav" onclick="historyView()"><span class="ico">◷</span><span>History</span></button><div class="sep"></div><div class="st">Explore</div><button class="nav" onclick="trending('gaming')"><span class="ico">🎮</span><span>Gaming</span></button><button class="nav" onclick="trending('music')"><span class="ico">♫</span><span>Music</span></button><button class="nav" onclick="trending('movies')"><span class="ico">▣</span><span>Movies</span></button></aside>
<main class="main"><section id="homePage"><div class="chips" id="chips"></div><div class="status" id="status">Loading YouTube…</div><div class="grid" id="grid"></div><div class="more"><button id="more" onclick="loadMore()">Load more</button></div></section><section id="watchPage" class="watch"><button class="back" onclick="home()">← Back to Home</button><div class="wgrid"><div><div class="player"><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="wtitle" id="wt"></div><div class="wrow"><div class="channel"><div class="ca" id="wa">YT</div><div><b id="wc"></b><div class="info" id="ws"></div></div></div><button class="sub" onclick="toast('Subscribe is handled by YouTube.')">Subscribe</button><button class="wa" onclick="toast('Like is handled by YouTube.')">♡ Like</button><button class="wa" onclick="share()">↗ Share</button></div><div class="desc" id="wd"></div></div><aside class="next" id="next"></aside></div></section></main></div></div><div class="toast" id="toast"></div>
<script>
const APIs=['https://pipedapi.kavin.rocks','https://pipedapi.tokhmi.xyz','https://pipedapi.syncpundit.io','https://pipedapi.moomoo.me','https://pipedapi.leptons.xyz'];
let apiIndex=0,items=[],query='',page=1,mode='trending',hist=JSON.parse(localStorage.getItem('uaYTHistory')||'[]');
const filters=['All','Trending','Gaming','Music','Movies'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(n){n=Number(n)||0;return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)}function dur(n){n=Number(n)||0;let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=Math.floor(n%60);return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')}function thumb(v){return v.thumbnail||'https://i.ytimg.com/vi/'+encodeURIComponent(v.url?.split('v=')[1]||v.videoId)+'/hqdefault.jpg'}function id(v){return v.videoId||(v.url||'').split('v=')[1]||''}function map(v){return{videoId:id(v),title:v.title||'',author:v.uploaderName||v.uploader||v.author||'',views:v.views||0,time:v.uploadedDate||'',duration:v.duration||0,thumb:v.thumbnail||'',avatar:v.uploaderAvatar||'',description:v.description||'',recommended:v.recommendedVideos||[]}}function status(t,on){let e=document.getElementById('status');e.textContent=t;e.classList.toggle('show',on)}async function api(path){let last;for(let i=0;i<APIs.length;i++){let idx=(apiIndex+i)%APIs.length;try{let r=await fetch(APIs[idx]+path,{headers:{Accept:'application/json'}});if(!r.ok)throw Error(r.status);let d=await r.json();apiIndex=idx;return d}catch(e){last=e}}throw last||Error('API unavailable')}
function chips(active='All'){document.getElementById('chips').innerHTML=filters.map(x=>`<button class="chip ${x.toLowerCase()===active.toLowerCase()?'active':''}" onclick="${x==='All'?'home()':`trending('${x.toLowerCase()}')`}">${x}</button>`).join('')}
function render(list,append=false){let g=document.getElementById('grid');if(!append)g.innerHTML='';g.insertAdjacentHTML('beforeend',list.map(v=>`<article class="card" onclick="watch('${encodeURIComponent(v.videoId)}')"><div class="thumb"><img src="${esc(thumb(v))}" loading="lazy"><span class="dur">${dur(v.duration)}</span></div><div class="meta"><div class="ca">${v.avatar?`<img src="${esc(v.avatar)}">`:'YT'}</div><div><div class="title">${esc(v.title)}</div><div class="info">${esc(v.author)}<br>${fmt(v.views)} views • ${esc(v.time)}</div></div></div></article>`).join(''))}
async function trending(type='default'){mode='trending';query='';page=1;showHome();chips(type==='default'?'Trending':type);status('Loading YouTube…',true);more(false);try{let d=await api('/trending?region=US');items=(Array.isArray(d)?d:[]).map(map);if(type!=='default')items=items.filter(v=>(v.title+' '+v.author).toLowerCase().includes(type));render(items);status('',false)}catch(e){status('YouTube data is unavailable right now. Try again later.',true)}}
async function search(q){q=String(q||'').trim();if(!q)return home();mode='search';query=q;page=1;showHome();chips('');status('Searching YouTube…',true);more(false);try{let d=await api('/search?q='+encodeURIComponent(q)+'&filter=videos&page=1');items=(Array.isArray(d)?d:[]).map(map);render(items);status('',false);more(items.length>0)}catch(e){status('Search failed. Try again later.',true)}}
async function loadMore(){if(mode!=='search'||!query)return;let b=document.getElementById('more');b.disabled=true;b.textContent='Loading…';try{page++;let d=await api('/search?q='+encodeURIComponent(query)+'&filter=videos&page='+page);let m=(Array.isArray(d)?d:[]).map(map);items=items.concat(m);render(m,true);b.disabled=false;b.textContent='Load more';if(!m.length)b.classList.remove('show')}catch(e){b.disabled=false;b.textContent='Load more';toast('Could not load more results')}}
async function watch(raw){let vid=decodeURIComponent(raw);let v=items.find(x=>x.videoId===vid)||{videoId:vid,title:'YouTube Video',author:'YouTube'};hist=[vid,...hist.filter(x=>x!==vid)].slice(0,50);localStorage.setItem('uaYTHistory',JSON.stringify(hist));document.getElementById('homePage').style.display='none';document.getElementById('watchPage').classList.add('open');document.getElementById('player').src='https://www.youtube.com/embed/'+encodeURIComponent(vid)+'?autoplay=1&rel=0&playsinline=1';try{v=Object.assign(v,map(await api('/streams/'+encodeURIComponent(vid))))}catch(e){}document.getElementById('wt').textContent=v.title;document.getElementById('wc').textContent=v.author||'YouTube';document.getElementById('ws').textContent=(v.views?fmt(v.views)+' views':'')+(v.time?' • '+v.time:'');document.getElementById('wd').textContent=v.description||'';let av=document.getElementById('wa');av.innerHTML=v.avatar?`<img src="${esc(v.avatar)}">`:'YT';try{let d=await api('/streams/'+encodeURIComponent(vid));let rec=(d.relatedStreams||[]).map(map).slice(0,8);document.getElementById('next').innerHTML=rec.map(x=>`<div class="mini" onclick="watch('${encodeURIComponent(x.videoId)}')"><img src="${esc(thumb(x))}"><div><div class="miniTitle">${esc(x.title)}</div><div class="miniInfo">${esc(x.author)}<br>${fmt(x.views)} views</div></div></div>`).join('')}catch(e){document.getElementById('next').innerHTML=''}}
function historyView(){showHome();chips('');items=[];status('Loading your local watch history…',true);more(false);Promise.all(hist.slice(0,20).map(async x=>{try{return map(await api('/streams/'+encodeURIComponent(x)))}catch(e){return null}})).then(a=>{items=a.filter(Boolean);render(items);status(items.length?'':'No watched videos saved yet.',!items.length)})}
function showHome(){document.getElementById('watchPage').classList.remove('open');document.getElementById('homePage').style.display='block';document.getElementById('player').src=''}function home(){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelector('[data-home]')?.classList.add('active');trending('default')}function more(on){let b=document.getElementById('more');b.classList.toggle('show',on);b.disabled=false;b.textContent='Load more'}function openYT(){let q=document.getElementById('q').value.trim();window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q||'YouTube'),'_blank','noopener')}function share(){let s=document.getElementById('player').src,id=s.split('/embed/')[1]?.split('?')[0],u='https://www.youtube.com/watch?v='+id;navigator.clipboard?.writeText(u).then(()=>toast('Link copied')).catch(()=>toast(u))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2200)}document.getElementById('form').onsubmit=e=>{e.preventDefault();search(document.getElementById('q').value)};chips('Trending');trending('default');
</script>
</body></html>
