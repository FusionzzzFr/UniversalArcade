<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f0f0f"><title>YouTube • Universal Arcade</title><link rel="stylesheet" href="css/style.css"><style>:root{--bg:#0f0f0f;--text:#f1f1f1;--muted:#aaa;--red:#ff0033}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.head{height:64px;display:flex;align-items:center;gap:20px;padding:0 18px;border-bottom:1px solid #222;background:#0f0f0f}.logo{display:flex;align-items:center;gap:9px;min-width:205px;color:#fff;text-decoration:none;font-size:21px;font-weight:700}.logoMark{width:34px;height:24px;border-radius:7px;background:var(--red);display:grid;place-items:center}.logoMark:after{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid white;margin-left:2px}.search{display:flex;flex:1;max-width:760px;height:42px}.search input{flex:1;min-width:0;background:#121212;color:#fff;border:1px solid #303030;border-right:0;border-radius:24px 0 0 24px;padding:0 18px;outline:0}.search button{width:64px;border:1px solid #303030;background:#222;color:#fff;border-radius:0 24px 24px 0;font-size:22px}.actions{margin-left:auto;display:flex;align-items:center;gap:8px}.action,.nav{border:0;background:none;color:#fff;cursor:pointer}.action{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px}.action:hover,.nav:hover,.nav.active{background:#272727}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#777,#222);display:grid;place-items:center;font-size:11px;font-weight:700}.body{display:flex;min-height:0;flex:1}.side{width:240px;flex:0 0 240px;padding:12px 10px;overflow:auto}.nav{width:100%;height:44px;border-radius:10px;display:flex;align-items:center;gap:22px;padding:0 16px;text-align:left;font-size:14px}.ico{width:22px;text-align:center;font-size:19px}.sep{height:1px;background:#292929;margin:13px 10px}.sideTitle{padding:10px 16px;font-size:13px;font-weight:700}.main{flex:1;min-width:0;overflow:auto;padding:18px 24px 70px}.chips{display:flex;gap:10px;overflow:auto;padding-bottom:20px;position:sticky;top:-18px;background:linear-gradient(var(--bg) 75%,transparent);z-index:3}.chip{border:0;border-radius:9px;background:#272727;color:#fff;padding:9px 15px;white-space:nowrap;cursor:pointer;font-size:13px}.chip.active{background:#fff;color:#111;font-weight:700}.status{text-align:center;color:#aaa;padding:55px 20px;display:none}.status.show{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 16px}.card{cursor:pointer;min-width:0}.thumb{position:relative;aspect-ratio:16/9;background:#222;border-radius:10px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}.card:hover .thumb img{transform:scale(1.02)}.duration{position:absolute;right:7px;bottom:7px;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.88);font-size:12px}.meta{display:grid;grid-template-columns:38px 1fr;gap:10px;margin-top:11px}.cavatar{width:36px;height:36px;border-radius:50%;background:#3b3b3b;display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:700}.cavatar img{width:100%;height:100%;object-fit:cover}.vtitle{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.info{font-size:13px;color:var(--muted);line-height:1.45;margin-top:3px}.more{text-align:center;padding:32px 0}.load{display:none;border:1px solid #3a3a3a;background:#222;color:#fff;border-radius:22px;padding:11px 18px;font-weight:700;cursor:pointer}.load.show{display:inline-block}.load:disabled{opacity:.5}.watch{display:none;max-width:1500px;margin:auto;padding:24px}.watch.open{display:block}.back{border:0;background:none;color:#ddd;cursor:pointer;margin-bottom:15px}.watchLayout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.65fr);gap:20px}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.watchTitle{font-size:22px;font-weight:700;line-height:1.35;margin-top:16px}.watchActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.channel{display:flex;align-items:center;gap:10px;margin-right:auto}.sub{border:0;background:#fff;color:#111;border-radius:20px;padding:10px 16px;font-weight:700}.wa{border:0;background:#272727;color:#fff;border-radius:20px;padding:10px 15px}.desc{margin-top:16px;padding:14px 16px;background:#272727;border-radius:10px;font-size:14px;line-height:1.55;white-space:pre-wrap}.next{display:flex;flex-direction:column;gap:12px}.mini{display:grid;grid-template-columns:160px 1fr;gap:9px;cursor:pointer}.mini img{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.miniTitle{font-size:14px;font-weight:600;line-height:1.35}.miniInfo{font-size:12px;color:#aaa;margin-top:3px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff;color:#111;padding:11px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.watchLayout{grid-template-columns:1fr}.next{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:800px){.side{width:72px;flex-basis:72px}.nav{justify-content:center;padding:0}.nav span:not(.ico),.sep,.sideTitle{display:none}.logo{min-width:auto}.logo span{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:14px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.actions .action:nth-child(1),.actions .action:nth-child(2){display:none}.logo{min-width:34px}.main{padding:10px}.watch{padding:12px}.next{display:flex}.mini img{width:140px}}</style></head><body><div class="app"><header class="head"><a class="logo" href="#" onclick="showHome();return false"><span class="logoMark"></span><span>YouTube</span></a><form class="search" id="searchForm"><input id="searchInput" placeholder="Search" autocomplete="off"><button type="submit">⌕</button></form><div class="actions"><button class="action" onclick="openRealYT()">↗</button><button class="action" onclick="toast('Theme is controlled by Universal Arcade settings.')">◐</button><button class="action" onclick="toast('Create is available on YouTube.')">＋</button><div class="avatar">UA</div></div></header><div class="body"><aside class="side"><button class="nav active" data-home onclick="homeNav()"><span class="ico">⌂</span><span>Home</span></button><button class="nav" onclick="searchYouTube('shorts')"><span class="ico">▶</span><span>Shorts</span></button><button class="nav" onclick="toast('Subscriptions require YouTube account access.')"><span class="ico">▣</span><span>Subscriptions</span></button><div class="sep"></div><button class="nav" onclick="showHistory()"><span class="ico">◷</span><span>History</span></button><button class="nav" onclick="toast('Watch later requires a YouTube account.')"><span class="ico">◫</span><span>Watch later</span></button><div class="sep"></div><div class="sideTitle">Explore</div><button class="nav" onclick="searchYouTube('gaming')"><span class="ico">🎮</span><span>Gaming</span></button><button class="nav" onclick="searchYouTube('music')"><span class="ico">♫</span><span>Music</span></button><button class="nav" onclick="searchYouTube('movies')"><span class="ico">▣</span><span>Movies</span></button></aside><main class="main"><section id="home"><div class="chips" id="chips"></div><div id="status" class="status">Loading YouTube…</div><div id="grid" class="grid"></div><div class="more"><button id="load" class="load" onclick="loadMore()">Load more</button></div></section><section id="watch" class="watch"><button class="back" onclick="showHome()">← Back to Home</button><div class="watchLayout"><div><div class="player"><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div id="watchTitle" class="watchTitle"></div><div class="watchActions"><div class="channel"><div id="watchAvatar" class="cavatar">YT</div><div><b id="watchChannel"></b><div id="watchStats" class="info"></div></div></div><button class="sub" onclick="toast('Subscribe is handled by YouTube.')">Subscribe</button><button class="wa" onclick="toast('Like is handled by YouTube.')">♡ Like</button><button class="wa" onclick="shareCurrent()">↗ Share</button></div><div id="watchDesc" class="desc"></div></div><aside id="next" class="next"></aside></div></section></main></div></div><div id="toast" class="toast"></div><script>
const API='https://api.allorigins.win/get?url=';const INSTANCES=['https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yt.chocolatemoo53.com'];let lastQuery='',page=1,mode='trending',currentItems=[],history=JSON.parse(localStorage.getItem('uaYTApiHistory')||'[]');const cats=[['All','all'],['Trending','trending'],['Gaming','gaming'],['Music','music'],['Movies','movies']];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function duration(n){n=Number(n)||0;let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=Math.floor(n%60);return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')}function fmt(n){n=Number(n)||0;if(n>=1e9)return(n/1e9).toFixed(1).replace('.0','')+'B';if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace('.0','')+'K';return String(n)}function thumb(v){let a=v.videoThumbnails||[];let b=a.find(x=>/maxres|high|medium/.test(x.quality||''))||a[a.length-1];return b?.url||'https://i.ytimg.com/vi/'+encodeURIComponent(v.videoId)+'/hqdefault.jpg'}function av(v){return v.authorThumbnails?.[0]?.url||''}function setStatus(t,on){let e=document.getElementById('status');e.textContent=t;e.classList.toggle('show',on)}function renderChips(active){document.getElementById('chips').innerHTML=cats.map(([t,k])=>`<button class="chip ${k===active?'active':''}" onclick="${k==='all'?'homeNav()':k==='trending'?'loadTrending()':`searchYouTube('${k}')`}">${t}</button>`).join('')}function map(v){return{videoId:v.videoId,title:v.title,author:v.author||v.channelName||'',authorThumbnails:v.authorThumbnails||[],videoThumbnails:v.videoThumbnails||[],description:v.description||'',viewCount:v.viewCount||0,publishedText:v.publishedText||'',lengthSeconds:v.lengthSeconds||0,liveNow:!!v.liveNow,recommendedVideos:v.recommendedVideos||[]}}async function getJson(url){let r=await fetch(API+encodeURIComponent(url));if(!r.ok)throw Error('proxy '+r.status);let o=await r.json();let c=typeof o.contents==='string'?o.contents:o;return typeof c==='string'?JSON.parse(c):c}async function api(path){let last;for(const base of INSTANCES){try{return await getJson(base+path)}catch(e){last=e}}throw last||Error('unavailable')}function render(items,append=false){let g=document.getElementById('grid');if(!append)g.innerHTML='';g.insertAdjacentHTML('beforeend',items.map(v=>`<article class="card" onclick="openVideo('${encodeURIComponent(v.videoId)}')"><div class="thumb"><img src="${esc(thumb(v))}" loading="lazy"><span class="duration">${v.liveNow?'LIVE':duration(v.lengthSeconds)}</span></div><div class="meta"><div class="cavatar">${av(v)?`<img src="${esc(av(v))}">`:'YT'}</div><div><div class="vtitle">${esc(v.title)}</div><div class="info">${esc(v.author||'YouTube')}<br>${fmt(v.viewCount)} views • ${esc(v.publishedText||'')}</div></div></div></article>`).join(''))}function showLoad(v){let b=document.getElementById('load');b.style.display=v?'inline-block':'none';b.disabled=false}async function loadTrending(q='default'){mode='trending';lastQuery='';page=1;renderChips(q==='default'?'trending':q);showHome();setStatus('Loading YouTube…',true);showLoad(false);try{let data=await api('/api/v1/trending?region=US&type='+encodeURIComponent(q));currentItems=(Array.isArray(data)?data:[]).map(map);render(currentItems);setStatus('',false)}catch(e){setStatus('Live YouTube data could not be loaded. The public relay or API instance may be unavailable.',true);toast('YouTube API unavailable')}}async function searchYouTube(q){q=String(q||'').trim();if(!q)return homeNav();mode='search';lastQuery=q;page=1;renderChips('');showHome();setStatus('Searching YouTube…',true);showLoad(false);try{let data=await api('/api/v1/search?q='+encodeURIComponent(q)+'&page=1&type=video&region=US');currentItems=(Array.isArray(data)?data:[]).filter(v=>v.type==='video').map(map);render(currentItems);setStatus('',false);showLoad(currentItems.length>0)}catch(e){setStatus('Search failed. Try again later.',true);toast('Search unavailable')}}async function loadMore(){if(mode!=='search'||!lastQuery)return;let b=document.getElementById('load');b.disabled=true;b.textContent='Loading…';try{let data=await api('/api/v1/search?q='+encodeURIComponent(lastQuery)+'&page='+(++page)+'&type=video&region=US');let more=(Array.isArray(data)?data:[]).filter(v=>v.type==='video').map(map);currentItems=currentItems.concat(more);render(more,true);if(!more.length)b.style.display='none';else{b.disabled=false;b.textContent='Load more'}}catch(e){b.disabled=false;b.textContent='Load more';toast('Could not load more results')}}async function openVideo(id){id=decodeURIComponent(id);document.getElementById('home').style.display='none';document.getElementById('watch').classList.add('open');document.getElementById('player').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1&origin='+encodeURIComponent(location.origin);let v=currentItems.find(x=>x.videoId===id)||{videoId:id};try{v=Object.assign(v,map(await api('/api/v1/videos/'+encodeURIComponent(id)+'?region=US')))}catch(e){}document.getElementById('watchTitle').textContent=v.title||'YouTube Video';document.getElementById('watchChannel').textContent=v.author||'YouTube';document.getElementById('watchStats').textContent=(v.viewCount?fmt(v.viewCount)+' views':'')+(v.publishedText?' • '+v.publishedText:'');document.getElementById('watchDesc').textContent=v.description||'';document.getElementById('watchAvatar').innerHTML=av(v)?`<img src="${esc(av(v))}">`:'YT';history=[id,...history.filter(x=>x!==id)].slice(0,50);localStorage.setItem('uaYTApiHistory',JSON.stringify(history));let rec=(v.recommendedVideos||[]).slice(0,8).map(map);document.getElementById('next').innerHTML=rec.map(x=>`<div class="mini" onclick="openVideo('${encodeURIComponent(x.videoId)}')"><img src="${esc(thumb(x))}"><div><div class="miniTitle">${esc(x.title)}</div><div class="miniInfo">${esc(x.author||'YouTube')}<br>${fmt(x.viewCount)} views</div></div></div>`).join('')}function showHome(){document.getElementById('watch').classList.remove('open');document.getElementById('home').style.display='block';document.getElementById('player').src=''}function homeNav(){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelector('[data-home]')?.classList.add('active');loadTrending('default')}async function showHistory(){showHome();renderChips('');let items=[];for(const id of history.slice(0,30)){try{items.push(map(await api('/api/v1/videos/'+encodeURIComponent(id)+'?region=US')))}catch(e){}}currentItems=items.filter(v=>v.videoId);render(currentItems);setStatus(currentItems.length?'':'No watched videos saved in this browser.',!currentItems.length);showLoad(false)}function openRealYT(){let q=document.getElementById('searchInput').value.trim();window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q||'YouTube'),'_blank','noopener')}function shareCurrent(){let s=document.getElementById('player').src,id=s.split('/embed/')[1]?.split('?')[0];if(!id)return;let u='https://www.youtube.com/watch?v='+id;navigator.clipboard?.writeText(u).then(()=>toast('YouTube link copied')).catch(()=>toast(u))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2200)}document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();searchYouTube(document.getElementById('searchInput').value)});renderChips('trending');loadTrending('default');
</script></body></html>
