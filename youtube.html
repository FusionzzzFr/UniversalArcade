<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>YouTube • Universal Arcade</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--yt-bg:#0f0f0f;--yt-text:#f1f1f1;--yt-muted:#aaa;--yt-red:#ff0033}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--yt-bg);color:var(--yt-text);font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}
.yt-app{height:100vh;display:flex;flex-direction:column;background:var(--yt-bg)}.yt-head{height:64px;display:flex;align-items:center;gap:20px;padding:0 18px;border-bottom:1px solid #181818;background:#0f0f0f;flex:0 0 64px;z-index:5}.yt-logo{display:flex;align-items:center;gap:9px;min-width:205px;color:#fff;text-decoration:none;font-size:21px;font-weight:700}.yt-logo-mark{width:34px;height:24px;border-radius:7px;background:var(--yt-red);display:grid;place-items:center}.yt-logo-mark:after{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #fff;margin-left:2px}.yt-search{display:flex;flex:1;max-width:760px;height:42px}.yt-search input{flex:1;min-width:0;background:#121212;color:#fff;border:1px solid #303030;border-right:0;border-radius:24px 0 0 24px;padding:0 18px;outline:0}.yt-search input:focus{border-color:#3ea6ff}.yt-search button{width:64px;border:1px solid #303030;background:#222;color:#fff;border-radius:0 24px 24px 0;font-size:22px;cursor:pointer}.yt-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.yt-action{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:19px;background:none;border:0;cursor:pointer}.yt-action:hover{background:#272727}.yt-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#777,#222);display:grid;place-items:center;font-size:11px;font-weight:700}.yt-body{display:flex;min-height:0;flex:1}.yt-side{width:240px;flex:0 0 240px;padding:12px 10px;overflow:auto}.yt-nav{width:100%;height:44px;border:0;border-radius:10px;background:none;color:#fff;display:flex;align-items:center;gap:22px;padding:0 16px;text-align:left;font-size:14px;cursor:pointer}.yt-nav:hover,.yt-nav.active{background:#272727}.yt-ico{width:22px;text-align:center;font-size:19px}.yt-sep{height:1px;background:#292929;margin:13px 10px}.yt-title{padding:10px 16px;font-size:13px;font-weight:700}.yt-main{flex:1;min-width:0;overflow:auto;padding:18px 24px 70px}.yt-chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:20px;position:sticky;top:-18px;background:linear-gradient(var(--yt-bg) 75%,transparent);z-index:3}.yt-chip{border:0;border-radius:9px;background:#272727;color:#fff;padding:9px 15px;white-space:nowrap;font-size:13px;cursor:pointer}.yt-chip.active{background:#fff;color:#111;font-weight:700}.yt-status{display:none;padding:50px 20px;text-align:center;color:#aaa}.yt-status.show{display:block}.yt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 16px}.yt-card{cursor:pointer;min-width:0}.yt-thumb{position:relative;aspect-ratio:16/9;background:#222;border-radius:10px;overflow:hidden}.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s ease}.yt-card:hover .yt-thumb img{transform:scale(1.02)}.yt-duration{position:absolute;right:7px;bottom:7px;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.88);font-size:12px}.yt-meta{display:grid;grid-template-columns:38px 1fr;gap:10px;margin-top:11px}.yt-cavatar{width:36px;height:36px;border-radius:50%;background:#3b3b3b;display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:700}.yt-cavatar img{width:100%;height:100%;object-fit:cover}.yt-vtitle{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.yt-info{font-size:13px;color:var(--yt-muted);line-height:1.45;margin-top:3px}.yt-more{display:flex;justify-content:center;padding:34px 0}.yt-load{display:none;padding:11px 18px;border:1px solid #3a3a3a;background:#222;color:#fff;border-radius:22px;font-weight:700;cursor:pointer}.yt-load.show{display:block}.yt-load:disabled{opacity:.5}.yt-watch{display:none;max-width:1500px;margin:auto;padding:24px}.yt-watch.open{display:block}.yt-back{border:0;background:none;color:#ddd;cursor:pointer;margin-bottom:15px;font-size:14px}.yt-watch-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.65fr);gap:20px}.yt-player{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.yt-player iframe{width:100%;height:100%;border:0}.yt-watch-title{font-size:22px;font-weight:700;line-height:1.35;margin-top:16px}.yt-watch-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.yt-channel{display:flex;align-items:center;gap:10px;margin-right:auto}.yt-sub{border:0;background:#fff;color:#111;border-radius:20px;padding:10px 16px;font-weight:700;cursor:pointer}.yt-wa{border:0;background:#272727;color:#fff;border-radius:20px;padding:10px 15px;cursor:pointer}.yt-desc{margin-top:16px;padding:14px 16px;background:#272727;border-radius:10px;font-size:14px;line-height:1.55;white-space:pre-wrap}.yt-next{display:flex;flex-direction:column;gap:12px}.yt-mini{display:grid;grid-template-columns:160px 1fr;gap:9px;cursor:pointer}.yt-mini img{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.yt-mini-title{font-size:14px;font-weight:600;line-height:1.35}.yt-mini-info{font-size:12px;color:#aaa;margin-top:3px}.yt-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff;color:#111;padding:11px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:20;font-size:14px}.yt-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.yt-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.yt-watch-layout{grid-template-columns:1fr}.yt-next{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:800px){.yt-side{width:72px;flex-basis:72px}.yt-nav{justify-content:center;padding:0}.yt-nav span:not(.yt-ico),.yt-sep,.yt-title{display:none}.yt-logo{min-width:auto}.yt-logo span{display:none}.yt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.yt-main{padding:14px}.yt-head{gap:10px}}@media(max-width:560px){.yt-grid{grid-template-columns:1fr}.yt-actions .yt-action:nth-child(1),.yt-actions .yt-action:nth-child(2){display:none}.yt-logo{min-width:34px}.yt-main{padding:10px}.yt-watch{padding:12px}.yt-next{display:flex}.yt-mini img{width:140px}}
</style>
</head>
<body>
<div class="yt-app"><header class="yt-head"><a class="yt-logo" href="#" onclick="showHome();return false"><span class="yt-logo-mark"></span><span>YouTube</span></a><form class="yt-search" id="searchForm"><input id="searchInput" placeholder="Search" autocomplete="off"><button type="submit">⌕</button></form><div class="yt-actions"><button class="yt-action" onclick="openRealYT()" title="Open YouTube">↗</button><button class="yt-action" onclick="toast('Theme is controlled by Universal Arcade settings.')">◐</button><button class="yt-action" onclick="toast('Create is available on YouTube.')">＋</button><div class="yt-avatar">UA</div></div></header>
<div class="yt-body"><aside class="yt-side"><button class="yt-nav active" data-nav="home" onclick="homeNav()"><span class="yt-ico">⌂</span><span>Home</span></button><button class="yt-nav" onclick="searchYouTube('shorts')"><span class="yt-ico">▶</span><span>Shorts</span></button><button class="yt-nav" onclick="toast('Sign-in based subscriptions are not available in a public static page.')"><span class="yt-ico">▣</span><span>Subscriptions</span></button><div class="yt-sep"></div><button class="yt-nav" onclick="showHistory()"><span class="yt-ico">◷</span><span>History</span></button><button class="yt-nav" onclick="toast('Watch later requires a signed-in YouTube account.')"><span class="yt-ico">◫</span><span>Watch later</span></button><div class="yt-sep"></div><div class="yt-title">Explore</div><button class="yt-nav" onclick="loadTrending('gaming')"><span class="yt-ico">🎮</span><span>Gaming</span></button><button class="yt-nav" onclick="loadTrending('music')"><span class="yt-ico">♫</span><span>Music</span></button><button class="yt-nav" onclick="loadTrending('movies')"><span class="yt-ico">▣</span><span>Movies</span></button></aside>
<main class="yt-main"><section id="homePage"><div class="yt-chips" id="chips"></div><div id="status" class="yt-status">Loading YouTube…</div><div id="grid" class="yt-grid"></div><div class="yt-more"><button id="loadMore" class="yt-load" onclick="loadMore()">Load more</button></div></section>
<section id="watchPage" class="yt-watch"><button class="yt-back" onclick="showHome()">← Back to Home</button><div class="yt-watch-layout"><div><div class="yt-player"><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div id="watchTitle" class="yt-watch-title"></div><div class="yt-watch-actions"><div class="yt-channel"><div id="watchAvatar" class="yt-cavatar">YT</div><div><b id="watchChannel"></b><div id="watchStats" class="yt-info"></div></div></div><button class="yt-sub" onclick="toast('Subscribe is handled by YouTube when you open the channel.')">Subscribe</button><button class="yt-wa" onclick="toast('Like is handled by YouTube.')">♡ Like</button><button class="yt-wa" onclick="shareCurrent()">↗ Share</button></div><div id="watchDesc" class="yt-desc"></div></div><aside id="next" class="yt-next"></aside></div></section></main></div></div><div id="toast" class="yt-toast"></div>
<script>
const INSTANCES=['https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yt.chocolatemoo53.com'];
let instanceIndex=0,searchPage=1,lastQuery='',mode='trending',currentItems=[],history=JSON.parse(localStorage.getItem('uaYTApiHistory')||'[]');
const cats=[['All','home'],['Trending','default'],['Gaming','gaming'],['Music','music'],['Movies','movies']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function duration(sec){sec=Number(sec)||0;let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')}
function fmt(n){n=Number(n)||0;if(n>=1e9)return(n/1e9).toFixed(1).replace('.0','')+'B';if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace('.0','')+'K';return String(n)}
function thumb(v){const a=v.videoThumbnails||[];const best=a.find(x=>/maxres|high|medium/.test(x.quality||''))||a[a.length-1];return best?.url||('https://i.ytimg.com/vi/'+encodeURIComponent(v.videoId)+'/hqdefault.jpg')}
function avatar(v){return v.authorThumbnails?.[0]?.url||''}
function renderChips(active='home'){document.getElementById('chips').innerHTML=cats.map(([t,k])=>`<button class="yt-chip ${k===active?'active':''}" onclick="${k==='home'?'homeNav()':`loadTrending('${k}')`}">${t}</button>`).join('')}
function setStatus(msg,on=true){const e=document.getElementById('status');e.textContent=msg;e.classList.toggle('show',on)}
function mapItem(v){return{videoId:v.videoId,title:v.title,author:v.author||v.channelName||'',authorId:v.authorId||'',authorThumbnails:v.authorThumbnails||[],videoThumbnails:v.videoThumbnails||[],description:v.description||'',viewCount:v.viewCount||0,publishedText:v.publishedText||'',lengthSeconds:v.lengthSeconds||0,liveNow:!!v.liveNow}}
async function api(path){let last;for(let i=0;i<INSTANCES.length;i++){const idx=(instanceIndex+i)%INSTANCES.length;try{const r=await fetch(INSTANCES[idx]+path,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();instanceIndex=idx;return d}catch(e){last=e}}throw last||Error('No instance')}
function renderVideos(items,append=false){const g=document.getElementById('grid');if(!append)g.innerHTML='';g.insertAdjacentHTML('beforeend',items.map(v=>`<article class="yt-card" onclick="openVideo('${encodeURIComponent(v.videoId)}')"><div class="yt-thumb"><img src="${esc(thumb(v))}" loading="lazy"><span class="yt-duration">${v.liveNow?'LIVE':duration(v.lengthSeconds)}</span></div><div class="yt-meta"><div class="yt-cavatar">${avatar(v)?`<img src="${esc(avatar(v))}" loading="lazy">`:'YT'}</div><div><div class="yt-vtitle">${esc(v.title)}</div><div class="yt-info">${esc(v.author||'YouTube')}<br>${fmt(v.viewCount)} views • ${esc(v.publishedText||'')}</div></div></div></article>`).join(''))}
function showLoadMore(show){const b=document.getElementById('loadMore');b.style.display=show?'block':'none';b.disabled=false;b.textContent='Load more'}
async function loadTrending(type='default'){mode='trending';lastQuery='';searchPage=1;showHome();renderChips(type==='default'?'default':type);setStatus('Loading YouTube…',true);showLoadMore(false);try{const d=await api('/api/v1/trending?region=US&type='+encodeURIComponent(type));currentItems=(Array.isArray(d)?d:[]).map(mapItem);renderVideos(currentItems);setStatus('',false)}catch(e){setStatus('The live YouTube data service could not be reached. Try again later.',true);toast('YouTube data unavailable')}}
async function searchYouTube(q){q=String(q||'').trim();if(!q)return homeNav();mode='search';lastQuery=q;searchPage=1;showHome();renderChips('');setStatus('Searching YouTube…',true);showLoadMore(false);try{const d=await api('/api/v1/search?q='+encodeURIComponent(q)+'&page=1&type=video&region=US');currentItems=(Array.isArray(d)?d:[]).filter(v=>v.type==='video').map(mapItem);renderVideos(currentItems);setStatus('',false);showLoadMore(currentItems.length>0)}catch(e){setStatus('Search failed. Try again.',true);toast('YouTube search unavailable')}}
async function loadMore(){if(mode!=='search'||!lastQuery)return;const b=document.getElementById('loadMore');b.disabled=true;b.textContent='Loading…';try{searchPage++;const d=await api('/api/v1/search?q='+encodeURIComponent(lastQuery)+'&page='+searchPage+'&type=video&region=US');const more=(Array.isArray(d)?d:[]).filter(v=>v.type==='video').map(mapItem);if(more.length){currentItems=currentItems.concat(more);renderVideos(more,true);b.disabled=false;b.textContent='Load more'}else b.style.display='none'}catch(e){b.disabled=false;b.textContent='Load more';toast('Could not load more results')}}
async function openVideo(id){id=decodeURIComponent(id);showHome();document.getElementById('homePage').style.display='none';document.getElementById('watchPage').classList.add('open');document.getElementById('player').src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1';let v=currentItems.find(x=>x.videoId===id)||null;try{const d=mapItem(await api('/api/v1/videos/'+encodeURIComponent(id)+'?region=US'));v=Object.assign({},v||{},d)}catch(e){}if(v){document.getElementById('watchTitle').textContent=v.title||'YouTube Video';document.getElementById('watchChannel').textContent=v.author||'YouTube';document.getElementById('watchStats').textContent=(v.viewCount?fmt(v.viewCount)+' views':'')+(v.publishedText?' • '+v.publishedText:'');document.getElementById('watchDesc').textContent=v.description||'';const av=avatar(v),wa=document.getElementById('watchAvatar');wa.innerHTML=av?`<img src="${esc(av)}">`:'YT'}history=[id,...history.filter(x=>x!==id)].slice(0,50);localStorage.setItem('uaYTApiHistory',JSON.stringify(history));try{const d=await api('/api/v1/videos/'+encodeURIComponent(id)+'?region=US');const rec=(d.recommendedVideos||[]).slice(0,8).map(mapItem);document.getElementById('next').innerHTML=rec.map(x=>`<div class="yt-mini" onclick="openVideo('${encodeURIComponent(x.videoId)}')"><img src="${esc(thumb(x))}"><div><div class="yt-mini-title">${esc(x.title)}</div><div class="yt-mini-info">${esc(x.author||'YouTube')}<br>${fmt(x.viewCount)} views</div></div></div>`).join('')}catch(e){document.getElementById('next').innerHTML=''}}
function showHome(){document.getElementById('watchPage').classList.remove('open');document.getElementById('homePage').style.display='block';document.getElementById('player').src=''}
function homeNav(){document.querySelectorAll('.yt-nav').forEach(x=>x.classList.remove('active'));document.querySelector('[data-nav="home"]')?.classList.add('active');loadTrending('default')}
async function showHistory(){showHome();renderChips('');setStatus('Loading watch history…',true);const items=[];for(const id of history.slice(0,30)){try{items.push(mapItem(await api('/api/v1/videos/'+encodeURIComponent(id)+'?region=US')))}catch(e){}}currentItems=items.filter(x=>x.videoId);renderVideos(currentItems);setStatus(items.length?'':'No watched videos saved in this browser.',!items.length);showLoadMore(false)}
function openRealYT(){const q=document.getElementById('searchInput').value.trim();window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q||'YouTube'),'_blank','noopener')}
function shareCurrent(){const src=document.getElementById('player').src,id=src.split('/embed/')[1]?.split('?')[0];if(!id)return;const url='https://www.youtube.com/watch?v='+id;navigator.clipboard?.writeText(url).then(()=>toast('YouTube link copied')).catch(()=>toast(url))}
function toast(text){const e=document.getElementById('toast');e.textContent=text;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2200)}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();searchYouTube(document.getElementById('searchInput').value)});renderChips('default');loadTrending('default');
</script>
</body>
</html>
